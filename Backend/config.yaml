# ==============================================================================
# Person B Configuration — Detection & Confidence Pipeline
# SIH26057: AI-Powered Marine Debris Detection via Side-Scan Sonar
# ==============================================================================

# --- Data Paths ---
data:
  synthetic_dir: "data/synthetic"
  images_train: "data/synthetic/images/train"
  images_val: "data/synthetic/images/val"
  images_test: "data/synthetic/images/test"
  labels_train: "data/synthetic/labels_yolo/train"
  labels_val: "data/synthetic/labels_yolo/val"
  metadata_train: "data/synthetic/metadata/train"
  metadata_val: "data/synthetic/metadata/val"
  output_dir: "outputs"

# --- Class Mapping ---
classes:
  0: "ghost_net"
  1: "debris"
  2: "rock_hard_negative"

num_classes: 3

# --- Detection (YOLO) ---
detection:
  model: "yolov8n.pt"                 # Pretrained weights (nano for fast prototyping)
  image_size: 640
  confidence_threshold: 0.25
  iou_threshold: 0.45
  device: "auto"                       # "auto" | "cpu" | "cuda" | "cuda:0"
  epochs: 50
  batch_size: 16
  patience: 10
  seed: 42
  checkpoint_dir: "outputs/checkpoints"

# --- Physics Engine ---
physics:
  # Canonical shadow geometry convention for SIH26057:
  #   Exact (Default):     Ls = object_height * ground_range / (altitude - object_height)
  #   Approximate (Mode):  Ls = object_height * ground_range / altitude
  # where ground_range = sqrt(slant_range^2 - altitude^2)
  #
  # Note: Heuristic thresholds require calibration against empirical validation data.
  use_exact: true                      # Canonical project convention: exact formulation is default
  consistency_tolerance: 0.20          # Relative error below this → consistent
  uncertainty_band: 0.40               # Relative error above tolerance but below this → uncertain
  score_sigma: 0.25                    # Gaussian width for consistency score
  min_shadow_length_px: 3              # Ignore shadows shorter than this
  max_shadow_length_px: 500            # Sanity cap

# --- Shadow Measurement (OpenCV) ---
shadow_measurement:
  # Intensity-based shadow detection
  intensity_threshold_method: "adaptive"  # "adaptive" | "otsu" | "fixed"
  fixed_threshold: 60                     # Used only if method = "fixed"
  adaptive_block_size: 31
  adaptive_c: 10

  # Morphological operations
  morph_kernel_size: 5
  morph_iterations: 2

  # Search region
  shadow_direction_deg: 0.0               # Default: shadow extends to the right (0 deg = away from nadir)
  search_direction_deg: 0.0               # Alias for backwards compatibility
  search_margin_px: 20                   # Extra pixels around highlight bbox for search
  search_extension_px: 200               # Search extension in pixels

  # Denoising
  denoise: true
  denoise_h: 10
  gaussian_blur_ksize: 5

  # Minimum connected component area to count as shadow
  min_shadow_area_px: 20

# --- Confidence Fusion ---
confidence:
  weights:
    detector: 0.40
    physics: 0.35
    shape: 0.15
    texture: 0.10

  # If physics verification fails or metadata is missing
  fallback_weights:
    detector: 0.65
    shape: 0.20
    texture: 0.15

  # Output scale
  output_min: 0.0
  output_max: 100.0

# --- Explainability ---
explainability:
  enabled: true
  method: "gradcam"                    # "gradcam" | "eigencam" | "scorecam"
  target_layer: null                   # null = auto-detect last conv layer
  colormap: "jet"
  alpha: 0.5                          # Overlay transparency
  output_dir: "outputs/heatmaps"

# --- Evaluation ---
evaluation:
  iou_threshold: 0.50
  output_dir: "outputs/evaluation"

# --- Reproducibility ---
seed: 42
